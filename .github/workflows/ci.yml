# CI: everything that needs no AI key. Typecheck, lint, unit tests, then a real build against Postgres with
# migrations and a smoke test. Required on every PR before it can merge to main (see CONTRIBUTING.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atliq
          POSTGRES_PASSWORD: atliq
          POSTGRES_DB: atliq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atliq" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://atliq:atliq@localhost:5432/atliq
      APP_TODAY: "2026-09-28"
      NEXT_TELEMETRY_DISABLED: "1"
      # A CI-only password for the seeded demo accounts.
      SEED_USER_PASSWORD: "ci-Rv7-seven-keys-91"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Input-gate eval (no AI)
        run: pnpm eval --gate-only
      - name: Migrate and seed
        run: pnpm db:migrate && pnpm seed
      - name: Build
        run: pnpm build
      - name: Smoke test
        run: |
          # The page smoke test runs in demo mode ("Viewing as" via the atliq_role cookie); sign-in is tested below.
          DEMO_MODE=1 pnpm start -p 3000 &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health >/dev/null && break; sleep 2; done
          curl -sf localhost:3000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/)" = "307"
          # /companies is the Contracts "By company" view, so it redirects.
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/companies)" = "307"
          for p in /dashboard /contracts /contracts/new /deals /register /exposure /offer /counsel /deadlines /insights /activity; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "localhost:3000$p")
            echo "$p -> $code"
            test "$code" = "200"
          done
          # Viewing as counsel still renders the dashboard.
          test "$(curl -s -o /dev/null -w '%{http_code}' -b 'atliq_role=counsel' localhost:3000/dashboard)" = "200"
          # The seeded data shows up: 15 open drafts, the five register rows with Orbit expired.
          for p in "/contracts?view=open" "/contracts?view=signed" "/contracts?filter=serious" "/register?tab=usual" "/register?tab=prec"; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "localhost:3000$p")" = "200"
          done
          curl -s "localhost:3000/contracts?view=open" | grep -q 'All open<b class="num">15</b>'
          curl -s "localhost:3000/register?tab=promises&f=all" | grep -q 'CMT-005'
          curl -s "localhost:3000/register?tab=promises&f=expired" | grep -q 'Orbit Travels'
          # Memory (P8): clause search, register editing for the admin only, missing signed contracts as placeholders.
          S=$(curl -s "localhost:3000/register?tab=search&q=45+days&type=payment")
          echo "$S" | grep -q 'Trustline NBFC' && echo "$S" | grep -q 'Brightwater Insurance'
          curl -s "localhost:3000/register?tab=promises" | grep -q 'Add a promise'
          ! curl -s -b atliq_role=counsel "localhost:3000/register?tab=promises" | grep -q 'Add a promise'
          curl -s localhost:3000/exposure | grep -q 'Signed but not on file'
          curl -s localhost:3000/exposure | grep -q 'tracker=C-0'
          # Deals (P9): Harrington's data gate is red until the BAA is signed; Gulf Crown needs the Al Noor waiver.
          DL=$(curl -s localhost:3000/deals)
          echo "$DL" | grep -q 'Data transfer not allowed'
          echo "$DL" | grep -q 'Needs a waiver: Al Noor Hospitality Group Clause 12.1'
          HH=$(echo "$DL" | grep -o '/deals/[0-9a-f-]\{36\}' | head -1)
          test "$(curl -s -o /dev/null -w '%{http_code}' "localhost:3000$HH")" = "200"
          curl -s localhost:3000/offer | grep -q 'Type the term'
          # Hand-off (P10): the counsel tracker for Karandeep, the questions page for counsel.
          curl -s localhost:3000/counsel | grep -q 'What we&#x27;ve asked counsel'
          curl -s -b atliq_role=counsel localhost:3000/counsel | grep -q 'Questions from AtliQ'
          curl -s -b atliq_role=counsel localhost:3000/dashboard | grep -q 'Questions waiting for you'
          # Review time on every dashboard (team plan for Karandeep and counsel).
          curl -s localhost:3000/dashboard | grep -q 'Team review time'
          curl -s localhost:3000/dashboard | grep -q 'Review time needed'
          curl -s -b atliq_role=reviewer localhost:3000/dashboard | grep -q 'Quick decisions'
          curl -s -b atliq_role=counsel localhost:3000/dashboard | grep -q '<h3>Review time</h3>'
          # Upload (no AI): a contract is stored, a scanned PDF and a duplicate are refused, a viewer is refused,
          # and a bulk signed upload moves coverage from 17 to 18.
          D="-F counterparty=Kaveri -F owner=Dhaval -F domain=retail -F clientCountry=India"
          test "$(curl -s -o /dev/null -w '%{http_code}' -F file=@test_contracts/contracts/TC01_kaveri_retail_msa.md $D localhost:3000/api/contracts)" = "201"
          test "$(curl -s -o /dev/null -w '%{http_code}' -F file=@test_contracts/contracts/TC01_kaveri_retail_msa.md $D localhost:3000/api/contracts)" = "409"
          test "$(curl -s -o /dev/null -w '%{http_code}' -F file=@test_contracts/formats/TC47_konkan_ports_msa_scanned.pdf $D localhost:3000/api/contracts)" = "422"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b atliq_role=counsel -F file=@test_contracts/contracts/TC02_maplecrest_outdoor_msa.md $D localhost:3000/api/contracts)" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' -F file=@test_contracts/contracts/TC03_sahyadri_agritech_nda.md localhost:3000/api/contracts/signed)" = "201"
          curl -s localhost:3000/register | grep -q 'Checked against 18 of 30'
      - name: Sign-in smoke test (demo mode off)
        run: |
          pnpm start -p 3001 &
          for i in $(seq 1 30); do curl -sf localhost:3001/api/health >/dev/null && break; sleep 2; done
          # Signed out: pages go to /login, APIs answer 401, and the demo cookie counts for nothing.
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3001/login)" = "200"
          curl -s -o /dev/null -w '%{redirect_url}' localhost:3001/dashboard | grep -q '/login?next=%2Fdashboard'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3001/api/contracts)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b atliq_role=ceo -X POST localhost:3001/api/contracts)" = "401"
          # Counsel (a viewer) reads but can't upload; only an admin manages users.
          C=$(pnpm -s ci:session counsel@atliq.test)
          curl -s -b "atliq_session=$C" localhost:3001/dashboard | grep -q 'Questions waiting for you'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "atliq_session=$C" -F file=@test_contracts/contracts/TC02_maplecrest_outdoor_msa.md localhost:3001/api/contracts)" = "403"
          curl -s -b "atliq_session=$C" localhost:3001/admin/users | grep -q 'Only an admin manages users.'
          A=$(pnpm -s ci:session karandeep@atliq.test)
          curl -s -b "atliq_session=$A" localhost:3001/admin/users | grep -q 'karandeep@atliq.test'
          curl -s -b "atliq_session=$A" localhost:3001/dashboard | grep -q 'Karandeep'
